<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style=
    "color: burlywood; 
    background-color: blanchedalmond;
    width: 200px; /* ou fit-content que ajusta o background-color para o exato tamanho do texto */
    padding: 10px; /* padding- top espaça só em cima || padding-bottom espaça só em baixo || padding-left: espaça para a esquerda e right para a direita  */
    border: 10px soft;  /* double é a linha dupla || dashed é tracejada */
    margin: 10px; /* afasta da lateral esquerda e de cima */
    border-radius: 80px; /* arredonda a borda */
    font-size: 25px;  /* tamanho da fonte */
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; /* nome da fonte */
    ">Caixa de texto</h1>
</body>
