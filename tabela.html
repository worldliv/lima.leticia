<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
    <table border="2px" cellpadding="10px"> 

        <!-- título da tabela -->
        <caption>Tabela de pedidos</caption>
        <thead>
        <tr>
            <td>Pedido</td>
            <td>Quantidade</td>
            <td>Preço</td>
        </tr>
        </thead>

        <tr>
            <td>Computador</td>
            <td>2</td>
            <td>R$3000,00</td>
        </tr>

        <tr>
            <td>Notebook</td>
            <td>4</td>
            <td>R$ 1500,00</td>
        </tr>

        <tr>
            <td colspan="2">Valor Total</td>
            <td>R$1200.00</td>
        </tr>

        <tr>
            <th rowspan="2">Teste</th>
            <td>Item 1</td>
            <td>Item 2</td>
        </tr>

        <tr>
            <td>Item 1</td>
            <td>Item 2</td>
        </tr>
    </table>
</body>
</html>
