<!-- AULA SOBRE FORMULÁRIOS -->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Criando nosso primeiro formulário</h1>
    <form>
        <label for="nome">Nome:</label>
        <!-- Nome: [___input__] -->
         <!-- ⤷ label -->
        <input type="text"
        id="nome"
        name= "nome"
        placeholder="Digite aqui o seu nome" 
        required> <!-- obrigatório -->
        <br>

        <label for="email">Email:</label>
        <input
        type="email"
        id="nome"
        name="email"
        placeholder="nome@email.com"
        required>
        <br>

        <label for="senha">Senha:</label>
        <input 
        type="password"
        id="senha"
        name="senha"
        placeholder="Digite sua senha"
        required>
        <br>

        <label for="idade">Idade:</label>
        <input 
        type="number"
        min="14"
        max="99"
        name="idade"
        placeholder="Digite sua idade"
        required>
        <br>

        <label for="">Data de Nascimento:</label>
        <input 
        type="date"
        id="nascimento"
        name="nascimento"
        required>
        <br>

        <input 
        type="tel"
        id="telefone"
        name="telefone"
        placeholder="(11)99999-9999"
        required>
        <br>

        <label for="">Foto:</label>
        <input
        type="file"
        id="foto"
        name="foto"
        > <!-- não obrigatório -->
        <br>

        <p>Turno preferido:</p>
            <input 
            type="radio"
            value="turno"
            id="manha"
            name="turno"
            >
            <label>Manha</label>

            <input 
            type="radio"
            value="turno"
            id="tarde"
            name="turno"
            >
            <label>Tarde</label>
            <br>

            <p>Matérias favoritas:</p>
            <input 
            type="checkbox"
            id="html"
            name="materias"
            value="html"
            >
            <label for="html">HTML</label>
            <input 
            type="checkbox"
            id="php"
            name="materias"
            value="php"
            >
            <label for="php">PHP</label>
            <br>

            <label for="curso">Curso:</label>
            <select name="curso" id="curso">
                <option value="">Selecione</option>
                <option value="dev">Desenvolvimento de Sistemas</option>
                <option value="mecatronica">Mecatrônica</option>
                <option value="automacao">Automação</option>
            </select>
            <br>

            <label for="mensagem">Mensagem:</label>
            <br>
            <textarea
            name="mensagem"
            id="mensagem"
            placeholder="Escreva sua mensagem"
            rows="5"
            cols="40px"
            ></textarea>
            <!-- rows  indica a quantidade de linhas do texto -->
            <br>

            <button type="submit">Enviar cadasto</button>
            <button type="reset">Resetar o preenchimento</button>

   </form>

</body>
</html>
